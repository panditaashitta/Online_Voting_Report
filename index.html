<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatic Voting Report</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-animation"></div>
    <div class="container">
        <header class="header">
            <div class="header-icon">🗳️</div>
            <h1>Automatic Voting Report Generation</h1>
            <p class="subtitle">AI-Powered Blockchain Voting Analytics Dashboard</p>
        </header>
        
        <div class="action-section">
            <button id="generateReport" class="generate-btn">
                <span class="btn-text">Generate Report</span>
                <span class="btn-icon">📊</span>
            </button>
            <div class="loading-spinner" id="loadingSpinner" style="display: none;">
                <div class="spinner"></div>
                <p>Analyzing voting data...</p>
            </div>
        </div>

        <div id="reportOutput" class="report-output">
            <div class="report-content" id="reportContent"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
